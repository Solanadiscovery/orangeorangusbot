name: Live member counter
on:
  schedule:
    - cron: "0 */5 * * *"   # riavvio ogni 5 ore (ogni avvio dura ~5,5 ore)
  workflow_dispatch:
concurrency:
  group: live-counter
  cancel-in-progress: true   # il nuovo avvio sostituisce il precedente
jobs:
  counter:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - run: python counter.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
