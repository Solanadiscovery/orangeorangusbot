name: Daily Telegram post
on:
  workflow_dispatch:       # avvio manuale per test
    inputs:
      only_x:
        description: "Pubblica solo su X (prova)"
        type: boolean
        default: false
permissions:
  contents: write  # per salvare state.json (traguardi già annunciati)
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          SCHED="${{ github.event.schedule }}"
          if [ -z "$SCHED" ] && [ -z "$ONLY_X" ]; then export SLOT=counter  # avvio manuale = aggiorna il contatore
          elif [ -n "$SCHED" ]; then export SLOT=$(printf %02d "$(echo "$SCHED" | cut -d' ' -f2)"); fi
          python post.py
          git config user.name "orangeorangus-bot"; git config user.email "bot@users.noreply.github.com"
          git diff --quiet state.json || (git commit -m "Update milestones" state.json && git push)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          ONLY_X: ${{ inputs.only_x && '1' || '' }}
